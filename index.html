<body>

<div class="tela-login" id="telaLogin">
<div class="luz-fundo"></div>
<div class="moldura">
<div class="caixa-login">
<div class="logo-principal">REAL SENSI</div>
<div class="sub-logo">ULTRA GOLD CYBER V29</div>
<div class="aviso-sistema">🔒 ACESSO RESTRITO AO SISTEMA</div>
<div class="icone-cadeado">🔐</div>
<input type="password" id="senha" class="entrada-senha" placeholder="DIGITE A SENHA">
<div id="erro" class="mensagem-erro">❌ SENHA INCORRETA! TENTE NOVAMENTE</div>
<button class="botao-entrar" onclick="abrirPainel()">⚡ ENTRAR</button>
<div class="versao-login">VERSÃO MASTER • 2026</div>
</div>
</div>
</div>

<div class="container">
<div class="card">
<div class="title">⚡ IA CALCULADORA ANTI-PINAR 1000%</div>

<input id="marca" placeholder="MARCA DO CELULAR">
<input id="modelo" placeholder="MODELO">
<input id="famoso" placeholder="INFLUENCIADOR">

<select id="tipo">
<option>BAIXA</option>
<option selected>MEDIA</option>
<option>ALTA</option>
</select>

<select id="modo">
<option selected>NORMAL</option>
<option>LENDA</option>
<option>PROIBIDA</option>
</select>

<select id="calibragem">
<option>CALIBRADA</option>
<option selected>PRO</option>
<option>ULTRA PRO</option>
</select>

<select id="usarDpi" onchange="toggleDpi()">
<option>OFF</option>
<option>ON</option>
</select>

<div id="dpiField" style="display:none;">
<input id="dpi" type="number" placeholder="DPI">
</div>

<button class="btn" onclick="processar()">⚡ GERAR SENSI 1000%</button>

<div id="loader">
<div class="olho-capa"><div class="iris"><div class="pupila"></div><div class="brilho"></div></div></div>
<h2 id="armaNome">ANALISANDO RECUO...</h2>
<div class="scan-box"><div class="scan-fill" id="scanFill"></div></div>
<h2 id="scanPercent">0%</h2>
</div>

<div id="result"><div id="cards"></div></div>
</div>
</div>

<script>

const scans=[
"ESTABILIZANDO MIRA...",
"REDUZINDO TREMIDO...",
"AJUSTANDO FOCO...",
"CALIBRANDO CAPA 1000%...",
"BLOQUEANDO RECUO...",
"SINCRONIZANDO DPI...",
"OTIMIZANDO PARA NÃO PINAR...",
"FINALIZANDO IA..."
];

function abrirPainel(){
const senha = document.getElementById("senha").value;
// ✅ SENHA ALTERADA PARA GERAR00 ✅
if(senha !== "GERAR00"){ 
    document.getElementById("erro").style.display="block"; 
    navigator.vibrate?.(300); 
    return; 
}
document.getElementById("telaLogin").style.display="none";
document.querySelector(".container").style.display="block";
}

function toggleDpi(){
const usar= document.getElementById("usarDpi").value;
document.getElementById("dpiField").style.display= usar==="ON" ? "block" : "none";
}

function processar(){
document.getElementById("loader").style.display="block";
document.getElementById("result").style.display="none";
let percent=0; const arma= document.getElementById("armaNome"); const fill= document.getElementById("scanFill"); const scan= document.getElementById("scanPercent");
let troca= setInterval(()=>{ arma.innerText= scans[Math.floor(Math.random()*scans.length)]; },180);
let barra= setInterval(()=>{ percent+=4; if(percent>100) percent=100; scan.innerText= percent+"%"; fill.style.width= percent+"%"; },100);
setTimeout(()=>{ clearInterval(troca); clearInterval(barra); document.getElementById("loader").style.display="none"; gerar(); },2600);
}

function criarBarra(nome,valor){
let largura = (valor / 200) * 100;
return`<div class="sensi-item"><div class="sensi-info"><div class="sensi-name">${nome}</div><div class="sensi-number">${valor}</div></div><div class="sensi-bar"><div class="sensi-fill" style="width:${largura}%"></div></div></div>`;
}

function gerar(){
const tipo = document.getElementById("tipo").value;
const modo = document.getElementById("modo").value;
const calibragem = document.getElementById("calibragem").value;
const marca = document.getElementById("marca").value.toLowerCase();
const modelo = document.getElementById("modelo").value.toLowerCase();
const famoso = document.getElementById("famoso").value.toLowerCase();
const dpi = Number(document.getElementById("dpi").value || 702); // ✅ DPI PADRÃO OTIMIZADO

let base = {geral:0, red:0, mira2:0, mira4:0, awm:0, livre:0, botao:0};
let potencia = 1.00;
let ajusteRecuo = 1.00;

// ✅ SENSI PERFEITA, NUNCA RUIM, VALORES ATÉ 200
if(tipo === "BAIXA"){
base = { geral:140, red:132, mira2:125, mira4:118, awm:112, livre:130, botao:40 };
potencia = 0.95;
ajusteRecuo = 0.90;
}
if(tipo === "MEDIA"){
base = { geral:170, red:162, mira2:153, mira4:145, awm:138, livre:160, botao:44 };
potencia = 1.15;
ajusteRecuo = 1.05;
}
if(tipo === "ALTA"){
base = { geral:200, red:198, mira2:188, mira4:176, awm:165, livre:192, botao:48 }; // ✅ MELHOR SENSI
potencia = 1.35;
ajusteRecuo = 1.20;
}

if(modo === "LENDA"){ potencia += 0.08; ajusteRecuo += 0.04; }
if(modo === "PROIBIDA"){ potencia += 0.15; ajusteRecuo += 0.08; } // ✅ PROIBIDA É A MAIS FORTE

if(calibragem === "PRO"){ potencia += 0.05; }
if(calibragem === "ULTRA PRO"){ potencia += 0.10; ajusteRecuo += 0.03; }

// ✅ AJUSTES POR MARCA
if(marca.includes("xiaomi")) { potencia += 0.06; ajusteRecuo -= 0.02; }
if(marca.includes("iphone")) { potencia += 0.12; ajusteRecuo += 0.06; }
if(marca.includes("samsung")) { potencia += 0.05; }
if(marca.includes("motorola")) { potencia += 0.03; ajusteRecuo -= 0.03; }
if(marca.includes("realme") || marca.includes("oppo")) { potencia += 0.07; }
if(marca.includes("poco") || marca.includes("redmi")) { potencia += 0.09; ajusteRecuo -= 0.04; }

// ✅ AJUSTES POR MODELO
if(modelo.includes("a03") || modelo.includes("a10")) { potencia -= 0.05; ajusteRecuo -= 0.05; }
if(modelo.includes("s23") || modelo.includes("s24")) { potencia += 0.04; }
if(modelo.includes("note")) { potencia += 0.06; }

// ✅ AJUSTES POR INFLUENCIADOR
if(famoso.includes("nobru")) { potencia += 0.07; base.botao = 46; ajusteRecuo += 0.05; }
if(famoso.includes("two9")) { potencia += 0.09; base.botao = 44; }
if(famoso.includes("cerol")) { potencia += 0.04; base.botao = 41; ajusteRecuo -= 0.02; }
if(famoso.includes("babi")) { potencia += 0.03; base.botao = 40; }
if(famoso.includes("level")) { potencia += 0.08; base.botao = 45; ajusteRecuo += 0.04; }
if(famoso.includes("mm")) { potencia += 0.06; base.botao = 43; }

let valores = {
geral: Math.round(base.geral * potencia),
red: Math.round(base.red * potencia * ajusteRecuo),
mira2: Math.round(base.mira2 * potencia * ajusteRecuo),
mira4: Math.round(base.mira4 * potencia * ajusteRecuo),
awm: Math.round(base.awm * potencia),
livre: Math.round(base.livre * potencia),
botao: base.botao
};

// ✅ GARANTE QUE NÃO PASSE DE 200 E FIQUE PERFEITA
valores.geral = Math.min(200, Math.max(100, valores.geral));
valores.red = Math.min(200, Math.max(100, valores.red));
valores.mira2 = Math.min(200, Math.max(80, valores.mira2));
valores.mira4 = Math.min(200, Math.max(70, valores.mira4));
valores.awm = Math.min(200, Math.max(60, valores.awm));
valores.livre = Math.min(200, Math.max(90, valores.livre));
valores.botao = Math.max(36, Math.min(48, valores.botao));

document.getElementById("cards").innerHTML=
`
<div class="sensi-box">
<div class="sensi-top">
<div class="sensi-title">IA CALCULADA 1:1</div>
<div class="sensi-badge">🔥 ${modo}</div>
</div>

${criarBarra("GERAL",valores.geral)}
${criarBarra("PONTO VERMELHO",valores.red)}
${criarBarra("MIRA 2X",valores.mira2)}
${criarBarra("MIRA 4X",valores.mira4)}
${criarBarra("AWM",valores.awm)}
${criarBarra("OLHADINHA",valores.livre)}

<div class="fire-box">
<div class="fire-number">${valores.botao}</div>
<div class="fire-text">BOTÃO ULTRA CAPA</div>
</div>

<div class="dpi-result">
